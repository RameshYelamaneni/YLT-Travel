# YLT Travels — Nginx reverse proxy
# Place at /etc/nginx/sites-available/ylttravels and symlink to sites-enabled.
# This proxies all /api/* traffic to the Go backend and serves the Next.js
# frontend for everything else.

upstream ylttravels_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream ylttravels_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ylttravels.com www.ylttravels.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ylttravels.com www.ylttravels.com;

    # SSL certs (use Let's Encrypt via certbot)
    ssl_certificate     /etc/letsencrypt/live/ylttravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ylttravels.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upload size for file uploads (director images, employee files)
    client_max_body_size 16M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Go backend API
    location /api/ {
        proxy_pass http://ylttravels_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js frontend (SSR)
    location / {
        proxy_pass http://ylttravels_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Static file cache (Next.js assets)
    location /_next/static/ {
        proxy_pass http://ylttravels_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
