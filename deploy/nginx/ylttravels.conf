# YLT Travels — Nginx: static Vite dist + Go ylt-api
# Place at /etc/nginx/sites-available/ylttravels and symlink to sites-enabled.

upstream ylttravels_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name ylttravels.com www.ylttravels.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ylttravels.com www.ylttravels.com;

    ssl_certificate     /etc/letsencrypt/live/ylttravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ylttravels.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/ylttravels/dist;
    index index.html;

    location /api/ {
        proxy_pass http://ylttravels_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
